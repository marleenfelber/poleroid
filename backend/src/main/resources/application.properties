spring.application.name=poleroid

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/poleroid
spring.datasource.username=poleroid
spring.datasource.password=${POLEROID_DB_PASSWORD}

# Hibernate must not create or change tables (Flyway does that)
spring.jpa.hibernate.ddl-auto=validate

# Backend only sends JSON: closes the database connection as soon as the service is done
spring.jpa.open-in-view=false